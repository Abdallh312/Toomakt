services:
  - type: web
    name: toomakt-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python start_cloud_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: TELEGRAM_AUTH_SECRET
        value: toomakt2026
      - key: DATABASE_URL
        sync: false
